name: CI/CD

# Pull requests: run tests + lint only.
# Push to main: also build the backend image, push it to Docker Hub and
# deploy to the AWS Lightsail server (livetestingserver.com).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ashishdwivedi2410/movie_trailer_maker
  DOMAIN: livetestingserver.com
  REMOTE_DIR: /opt/movie-trailer-maker

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests (no API key needed)
        run: pytest -v

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install linters
        run: npm install --no-save htmlhint stylelint stylelint-config-standard eslint
      - run: npx htmlhint "frontend/**/*.html"
      - run: npx stylelint "frontend/css/**/*.css"
      - run: npx eslint "frontend/js/**/*.js"

  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    concurrency: production-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USER }}
        run: |
          for v in SSH_KEY HOST SSH_USER; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is empty. Check Settings > Secrets and variables > Actions (SSH_KEY, HOST, USER)."
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strip Windows line endings (\r) that break pasted keys.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Fails with a clear message if the key is malformed.
          echo "Fingerprint of the key GitHub is using:"
          ssh-keygen -lf ~/.ssh/id_ed25519 || { echo "::error::SSH_KEY secret is not a valid private key"; exit 1; }

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        env:
          TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: ssh -o BatchMode=yes "$TARGET" "echo connected as $(whoami)"

      - name: Upload devops files and frontend
        env:
          TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: bash devops/scripts/push-to-server.sh "$TARGET" "$REMOTE_DIR"

      - name: Pull image and restart
        env:
          TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: ssh "$TARGET" "bash $REMOTE_DIR/devops/scripts/deploy.sh"

      - name: Health check
        run: curl -fsS --retry 12 --retry-delay 5 --retry-connrefused "https://$DOMAIN/health"